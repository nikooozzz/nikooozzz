    <defs>
        <!-- Dynamic Gradient Backdrop -->
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#311b92" />
            <stop offset="100%" stop-color="#4a148c" />
        </linearGradient>

        <!-- Drop Shadow Filter for Sharp Text Readability over Landscapes -->
        <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.65" />
        </filter>
    </defs>

    <!-- Outer Frame & Gradient Sky -->
    <rect width="100%" height="100%" rx="24" class="bg-card" />
    <rect x="1.5" y="1.5" width="797" height="197" rx="22" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="2" />

